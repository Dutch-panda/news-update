timezone_offset_hours: 4

schedule_slots:
  morning: "Morning Update (08:00)"
  afternoon: "Afternoon Update (15:00)"
  night: "Night Update (23:00)"

digest:
  items_per_category: 4
  max_total_items: 22
  max_per_source_in_category: 3
  dedup_retention_days: 14
  description_max_chars: 160

categories:
  - key: trending_tech
    title: "💻 Trending Tech News"
    max_items: 5
    keywords:
      - apple
      - google
      - microsoft
      - meta
      - nvidia
      - amd
      - tsmc
      - intel
      - startup
      - acquisition
      - funding
      - cybersecurity
