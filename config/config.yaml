sources:
  scheduled_lookback_hours: 10
  on_demand_lookback_hours: 24
  rss_lookback_hours: 24

  hackernews:
    enabled: true
    min_points: 25
    targeted_min_points: 10
    lookback_hours: 24
    targeted_queries:
      - "ai agent"
      - "agentic"
      - "mcp"
      - "claude code"
      - "codex"
      - "llm"
      - "data science"
      - "duckdb"
      - "polars"
      - "Show HN"

  github:
    enabled: true
    trending_since: "daily"
    trending_languages:
      - ""
      - "python"
      - "typescript"
      - "jupyter-notebook"
      - "rust"
    search_enabled: false
    search_lookback_days: 3
    search_min_stars: 50
    search_queries:
      - "topic:ai-agents"
      - "topic:agentic-ai"
      - "topic:mcp"
      - "llm agent"
      - "ai cli tool"

