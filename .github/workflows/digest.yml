name: Scheduled News & Trends Digest

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Optional edition override (morning, afternoon, night)"
        required: false
        default: ""
      topics:
        description: "Optional comma-separated topics (e.g. politics,economy or all)"
        required: false
        default: ""
      chat_id:
        description: "Optional Telegram chat ID override"
        required: false
        default: ""
      on_demand:
        description: "On-demand mode (skips archiving & dedup state write)"
        required: false
        default: "false"

# Serialize archive-writing runs so concurrent triggers never race on git push
concurrency:
  group: digest-${{ github.event.inputs.on_demand == 'true' && github.run_id || 'scheduled' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          INPUT_EDITION: ${{ github.event.inputs.edition }}
          INPUT_TOPICS: ${{ github.event.inputs.topics }}
          INPUT_CHAT_ID: ${{ github.event.inputs.chat_id }}
          INPUT_ON_DEMAND: ${{ github.event.inputs.on_demand }}
        run: |
          ARGS=""
          if [ -n "$INPUT_EDITION" ]; then
            ARGS="$ARGS --edition $INPUT_EDITION"
          fi
          if [ -n "$INPUT_TOPICS" ]; then
            ARGS="$ARGS --topics $INPUT_TOPICS"
          fi
          if [ -n "$INPUT_CHAT_ID" ]; then
            ARGS="$ARGS --chat-id $INPUT_CHAT_ID"
          fi
          if [ "$INPUT_ON_DEMAND" = "true" ]; then
            ARGS="$ARGS --on-demand"
          fi
          python -m src.cli run $ARGS

      - name: Commit and push updated archive and site
        if: ${{ github.event.inputs.on_demand != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .nojekyll digests/ docs/ data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update news digest ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git pull --rebase
          git push
